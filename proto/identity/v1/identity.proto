syntax = "proto3";

package identity.v1;

option go_package = "github.com/leona-art/mahjong-go/gen/identity/v1;identityv1";

// PlayerService manages Player profiles tied to a Firebase Authentication
// uid. Account creation and login themselves are handled by Identity
// Platform on the client; this service only manages the profile linked to
// the caller's authenticated uid.
service PlayerService {
  // RegisterPlayer creates a Player profile for the caller's authenticated
  // uid. It fails if a profile already exists for that uid.
  rpc RegisterPlayer(RegisterPlayerRequest) returns (RegisterPlayerResponse) {}
  // GetPlayer looks up a Player profile by uid.
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse) {}
}

message Player {
  string uid = 1;
  string display_name = 2;
}

message RegisterPlayerRequest {
  // The uid is taken from the caller's authenticated Firebase ID token, not
  // from this request, so it is intentionally absent here.
  string display_name = 1;
}

message RegisterPlayerResponse {
  Player player = 1;
}

message GetPlayerRequest {
  string uid = 1;
}

message GetPlayerResponse {
  Player player = 1;
}
